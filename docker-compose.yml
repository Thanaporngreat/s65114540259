# docker-compose.yml (เวอร์ชันสมบูรณ์ตามตัวอย่างอาจารย์)

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init-pg:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    networks:
      - app-net
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: "production"
      PORT: "8000"
      DB_HOST: "postgres"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_PORT: "5432"
      INIT_USER_EMAIL: ${INIT_USER_EMAIL}
      INIT_USER_PASSWORD: ${INIT_USER_PASSWORD}
      INIT_USER_NAME: ${INIT_USER_NAME}
    networks:
      - app-net
      - traefik-public
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # ✅ เพิ่ม label นี้เข้ามา เพื่อระบุ network ให้ Traefik
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.s65114540259-backend-router.rule=PathPrefix(`/s65114540259/api`)"
      - "traefik.http.middlewares.s65114540259-stripprefix-api.stripprefix.prefixes=/s65114540259/api"
      - "traefik.http.routers.s65114540259-backend-router.middlewares=s65114540259-stripprefix-api"
      - "traefik.http.services.s65114540259-backend-service.loadbalancer.server.port=8000"

  adminer:
    image: adminer
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    networks:
      - app-net
      - traefik-public
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # ✅ เพิ่ม label นี้เข้ามา
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.s65114540259-adminer-router.rule=PathPrefix(`/s65114540259/adminer`)"
      - "traefik.http.middlewares.s65114540259-stripprefix-adminer.stripprefix.prefixes=/s65114540259/adminer"
      - "traefik.http.routers.s65114540259-adminer-router.middlewares=s65114540259-stripprefix-adminer"
      - "traefik.http.services.s65114540259-adminer-service.loadbalancer.server.port=8080"

  myapp:
    build: ./myapp
    container_name: myapp
    environment:
      PUBLIC_URL: "/s65114540259"
      REACT_NATIVE_PACKAGER_HOSTNAME: "0.0.0.0"
      CHOKIDAR_USEPOLLING: "1"
    networks:
      - app-net
      - traefik-public
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # ✅ เพิ่ม label นี้เข้ามา
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.s65114540259-myapp-router.rule=PathPrefix(`/s65114540259`)"
      - "traefik.http.routers.s65114540259-myapp-router.priority=1"
      - "traefik.http.services.s65114540259-myapp-service.loadbalancer.server.port=3000"

volumes:
  pg_data:

networks:
  app-net:
    driver: bridge
  traefik-public:
    external: true